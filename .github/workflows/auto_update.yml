name: Auto Update Fibwatch Playlist

on:
  schedule:
    # প্রতিদিন প্রতি ৬ ঘণ্টা পর পর রান হবে (আপনি চাইলে সময় পরিবর্তন করতে পারেন)
    - cron: '0 */6 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার বাটন পাওয়ার জন্য

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python main.py

      - name: Commit and Push updated playlist
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u
          git diff-index --quiet HEAD || git commit -m "Auto-updated playlist links"
          git push
